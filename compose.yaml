services:
  backend-api:
    image: "${BACKEND_IMAGE:-aic2026-backend}:${IMAGE_TAG:-local}"

    build:
      context: ./backendAIC2025
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: "false"
      MONGO_ENABLED: "false"
      SEARCH_ENABLED: "false"
      USER_ROUTES_ENABLED: "false"

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/app')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:

    image: "${FRONTEND_IMAGE:-aic2026-frontend}:${IMAGE_TAG:-local}"
    
    build:
      context: ./frontend-final/vite-project
      dockerfile: Dockerfile


    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8088}:80"

    depends_on:
      backend-api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s