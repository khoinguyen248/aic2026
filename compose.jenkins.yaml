services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    container_name: aic-jenkins
    restart: unless-stopped

    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-data: